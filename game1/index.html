<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vegetable Memory Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    .game-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 0.5rem;
      color: #1a1a1a;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 2rem;
      min-height: 320px;
    }

    .card {
      aspect-ratio: 1;
      background: white;
      border: 2px solid #3b82f6;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
      user-select: none;
      transition: all 0.3s ease;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      perspective: 1000px;
    }

    .card:hover:not(.disabled) {
      border-color: #2563eb;
      background: #f9fafb;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .card-front,
    .card-back {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      position: absolute;
    }

    .card-back {
      transform: rotateY(180deg);
      font-size: 50px;
    }

    .drag-zone {
      background: #f3f4f6;
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      margin-bottom: 2rem;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .drag-zone.active {
      background: #dcfce7;
      border-color: #22c55e;
    }

    .drag-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 1rem;
    }

    .draggable-word {
      background: #3b82f6;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s;
      display: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      border: 2px solid #3b82f6;
    }

    .draggable-word:active {
      opacity: 0.9;
      transform: scale(0.95);
    }

    .draggable-word.selected {
      background: #1e40af;
      border-color: #1e40af;
      transform: scale(1.05);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }

    .card {
      aspect-ratio: 1;
      background: white;
      border: 2px solid #3b82f6;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
      user-select: none;
      transition: all 0.3s ease;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      perspective: 1000px;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .card:active:not(.disabled) {
      transform: scale(0.95);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .card.drop-target {
      background: #dbeafe;
      border-color: #0284c7;
      transform: scale(1.08);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.3);
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
      color: #1a1a1a;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }

    button.primary:hover {
      background: #2563eb;
      border-color: #2563eb;
    }

    .timer {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-top: 1rem;
      text-align: center;
      display: none;
    }

    .timer.warning {
      color: #ef4444;
    }

    .game-message {
      color: #666;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideOut {
      to {
        opacity: 0;
        transform: translateY(20px);
      }
    }

    .toast.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .toast.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .toast.exit {
      animation: slideOut 0.3s ease-in forwards;
    }

    @media (max-width: 1024px) {
      .cards-grid {
        gap: 16px;
      }

      .card {
        border-width: 3px;
      }

      .draggable-word {
        padding: 1.2rem 2rem;
        font-size: 20px;
      }

      button {
        padding: 1rem 2rem;
        font-size: 16px;
      }
    }

    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .header h1 {
        font-size: 24px;
      }

      .stats-container {
        grid-template-columns: 1fr 1fr;
      }

      .card {
        border-width: 2px;
      }
    }

    @media (max-width: 600px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .header h1 {
        font-size: 22px;
      }

      .stats-container {
        grid-template-columns: 1fr;
      }

      .drag-zone {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1>🥕 Vegetable Memory Game</h1>
      <p>Match the words to the correct vegetables</p>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Correct</div>
        <div class="stat-value" id="correct">0/5</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Status</div>
        <div class="stat-value" id="status" style="font-size: 16px;">Ready</div>
      </div>
    </div>

    <div id="timer-display" class="timer"></div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="drag-zone" id="dragZone">
      <div class="drag-label">Tap the vegetable word, then tap a card to match</div>
      <div class="draggable-word" id="draggableWord" draggable="true"></div>
      <div class="game-message" id="gameMessage"></div>
    </div>

    <div class="controls">
      <button class="primary" id="startBtn" onclick="startGame()">Start Game</button>
      <button onclick="resetGame()">Reset</button>
    </div>
  </div>

  <script>
    const vegetables = [
      { name: 'Carrot', emoji: '🥕' },
      { name: 'Broccoli', emoji: '🥦' },
      { name: 'Tomato', emoji: '🍅' },
      { name: 'Lettuce', emoji: '🥬' },
      { name: 'Cucumber', emoji: '🥒' },
      { name: 'Pepper', emoji: '🫑' },
      { name: 'Onion', emoji: '🧅' },
      { name: 'Potato', emoji: '🥔' }
    ];

    let gameState = {
      cards: [],
      currentWord: null,
      score: 0,
      correct: 0,
      isMemorizing: false,
      isMatching: false,
      draggedFrom: null,
      timerInterval: null,
      touchData: {
        isDragging: false,
        ghostElement: null,
        startX: 0,
        startY: 0
      }
    };

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initializeGame() {
      const shuffled = shuffle(vegetables);
      gameState.cards = shuffled.map((veg, index) => ({
        id: index,
        vegetable: veg,
        matched: false
      }));
      gameState.score = 0;
      gameState.correct = 0;
      renderCards();
      updateStats();
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      gameState.cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.id = `card-${card.id}`;
        cardEl.draggable = false;
        cardEl.style.position = 'relative';

        const front = document.createElement('div');
        front.className = 'card-front';
        front.textContent = index + 1;

        const back = document.createElement('div');
        back.className = 'card-back';
        back.textContent = card.vegetable.emoji;

        cardEl.appendChild(front);
        cardEl.appendChild(back);

        grid.appendChild(cardEl);
      });
    }

    function showCards() {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        card.classList.add('flipped');
      });
    }

    function hideCards() {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        card.classList.remove('flipped');
      });
    }

    function startGame() {
      if (gameState.isMemorizing || gameState.isMatching) return;

      initializeGame();
      gameState.isMemorizing = true;
      document.getElementById('status').textContent = 'Memorizing...';
      document.getElementById('gameMessage').innerHTML = 'Look carefully at the vegetables!';
      document.getElementById('startBtn').disabled = true;

      showCards();

      let timeLeft = 15;
      const timerDisplay = document.getElementById('timer-display');
      timerDisplay.style.display = 'block';
      timerDisplay.classList.remove('warning');

      gameState.timerInterval = setInterval(() => {
        timerDisplay.textContent = `⏱️ Time: ${timeLeft}s`;
        if (timeLeft <= 5) {
          timerDisplay.classList.add('warning');
        }
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(gameState.timerInterval);
          endMemorizing();
        }
      }, 1000);
    }

    function endMemorizing() {
      gameState.isMemorizing = false;
      gameState.isMatching = true;
      document.getElementById('startBtn').disabled = false;
      hideCards();
      document.getElementById('timer-display').style.display = 'none';
      document.getElementById('timer-display').classList.remove('warning');
      document.getElementById('status').textContent = 'Matching...';
      document.getElementById('gameMessage').innerHTML = '';
      deselectWord();
      showNextWord();
    }

    function showNextWord() {
      if (gameState.correct >= 5) {
        completeGame();
        return;
      }

      const unmatched = gameState.cards.filter(card => !card.matched);
      if (unmatched.length === 0) {
        completeGame();
        return;
      }

      const randomCard = unmatched[Math.floor(Math.random() * unmatched.length)];
      gameState.currentWord = randomCard;

      const wordEl = document.getElementById('draggableWord');
      wordEl.textContent = randomCard.vegetable.name;
      wordEl.style.display = 'inline-block';
      deselectWord();
      setupCardClickListeners();
    }

    function completeGame() {
      gameState.isMatching = false;
      document.getElementById('status').textContent = 'Complete! 🎉';
      document.getElementById('gameMessage').innerHTML = `Game finished! Final score: ${gameState.score}`;
      document.getElementById('draggableWord').style.display = 'none';
    }

    function updateStats() {
      document.getElementById('score').textContent = gameState.score;
      document.getElementById('correct').textContent = `${gameState.correct}/5`;
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('exit');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    function handleCardDrop(e, cardIndex) {
      if (!gameState.isMatching || !gameState.currentWord) return;

      deselectWord();
      const card = gameState.cards[cardIndex];

      if (card.id === gameState.currentWord.id) {
        card.matched = true;
        gameState.correct++;
        gameState.score += 200;
        showToast(`✓ Correct! ${gameState.currentWord.vegetable.name}`, 'success');
        updateStats();
        showNextWord();
      } else {
        gameState.score = Math.max(0, gameState.score - 50);
        showToast(`✗ Wrong! Try again.`, 'error');
        updateStats();
      }
    }

    const draggableWord = document.getElementById('draggableWord');
    const cardsGrid = document.getElementById('cardsGrid');

    function getCardAtIndex(index) {
      return document.querySelectorAll('.card')[index];
    }

    function selectWord() {
      draggableWord.classList.add('selected');
      document.getElementById('gameMessage').textContent = 'Now tap a card to match!';
    }

    function deselectWord() {
      draggableWord.classList.remove('selected');
      document.getElementById('gameMessage').textContent = '';
    }

    function setupCardClickListeners() {
      document.querySelectorAll('.card').forEach((card, index) => {
        card.onclick = function(e) {
          if (!gameState.isMatching || !gameState.currentWord || !draggableWord.classList.contains('selected')) {
            return;
          }
          e.stopPropagation();
          handleCardDrop(e, index);
        };
      });
    }

    draggableWord.onclick = function(e) {
      if (!gameState.isMatching) return;
      e.stopPropagation();
      
      if (draggableWord.classList.contains('selected')) {
        deselectWord();
      } else {
        selectWord();
      }
    };

    draggableWord.addEventListener('touchstart', function(e) {
      if (!gameState.isMatching) return;
      e.preventDefault();
      
      if (draggableWord.classList.contains('selected')) {
        deselectWord();
      } else {
        selectWord();
      }
    }, false);

    document.addEventListener('click', function(e) {
      if (!gameState.isMatching) return;
      if (e.target === draggableWord || draggableWord.contains(e.target)) return;
      if (e.target.classList.contains('card')) return;
      
      deselectWord();
    });

    function resetGame() {
      if (gameState.timerInterval) {
        clearInterval(gameState.timerInterval);
      }
      gameState.touchData.isDragging = false;
      
      gameState.cards = [];
      gameState.currentWord = null;
      gameState.score = 0;
      gameState.correct = 0;
      gameState.isMemorizing = false;
      gameState.isMatching = false;
      gameState.draggedFrom = null;
      gameState.timerInterval = null;
      
      document.getElementById('status').textContent = 'Ready';
      document.getElementById('gameMessage').innerHTML = '';
      document.getElementById('draggableWord').style.display = 'none';
      document.getElementById('draggableWord').classList.remove('selected');
      document.getElementById('timer-display').style.display = 'none';
      document.getElementById('startBtn').disabled = false;
      document.querySelectorAll('.card').forEach(card => {
        card.classList.remove('drop-target', 'flipped');
        card.onclick = null;
      });
      updateStats();
      renderCards();
    }

    initializeGame();
  </script>
</body>
</html>
